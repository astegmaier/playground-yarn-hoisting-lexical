yarnPath: .yarn/releases/yarn-4.10.3.cjs

# Enable zero-installs (optional - stores packages in .yarn/cache)
# enableGlobalCache: false

# Set the node linker to 'node-modules' for compatibility with existing tools
nodeLinker: node-modules

# OR (experiment) use 'pnpm' install strategy for stricter isolation
# nodeLinker: pnpm
# globalFolder: ./.temp-yarn-global-cache

# Package manager configuration
enableTelemetry: false

# Workspace configuration
enableTransparentWorkspaces: false

plugins:
  - checksum: 44a06a583a46ab1e2de2a04c115868bea51f01a314f261b628fbf6d92b2be63c0d155be3d3094d440daf58ff3f263aba4c9384a1c60c5d26cc0db086ad990459
    path: .yarn/plugins/@yarnpkg/plugin-after-install.cjs
    spec: 'https://raw.githubusercontent.com/mhassan1/yarn-plugin-after-install/v0.7.0/bundles/@yarnpkg/plugin-after-install.js'
  - ./plugins/fixup-transitive-peer-dependencies.js

afterInstall: node ./scripts/add-lexical-debug-info.js

###############
# Workarounds #
###############

# Approach #1: supply the peerDependencies directly from the intermediate package.

# packageExtensions: {
#   "@lexical/markdown@0.12.6": {
#     dependencies: {
#       "@lexical/clipboard": 0.12.6,
#       "@lexical/selection": 0.12.6
#     }
#   }
# }

# Approach #2: make the intermediate package "pass along" the peerDependencies requirement, which is now the responsibility of the package up the chain (i.e. this repo) to supply.
# Thoughts: this seems more correct as a general pattern, since the whole point of peer deps is that the consumer (i.e. the package in the repo) would supply them.
# Although in this case, I think lexical ended up with a system where everything marches in tandem with the exact same dependency number, so it doesn't matter.

# packageExtensions: {
#   "@lexical/markdown@0.12.6": {
#     peerDependencies: {
#       "@lexical/clipboard": 0.12.6,
#       "@lexical/selection": 0.12.6
#     }
#   },
# }

# Another tidbit: it's possible to augment _workspace_ packages from package extensions.
# So if we were to build an automated tool that had the effect of "auto-installing" peers, we could leverage this:

# packageExtensions: {
#   "@lexical/markdown@0.12.6": {  
#     "package-a@*": {
#       dependencies: {
#       "@lexical/clipboard": 0.12.6
#       }
#     }
#   }
# }